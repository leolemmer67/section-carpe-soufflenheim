<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Section Carpe de Soufflenheim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(255,255,255,0.3);
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .section h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .session-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .session-title {
            font-size: 1.4em;
            color: #1e3c72;
            font-weight: bold;
        }

        .form-group {
            margin: 15px 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin: 5px;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #f44336;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-primary {
            background: #2196F3;
        }

        .btn-primary:hover {
            background: #0b7dda;
        }

        .reservations-list {
            margin-top: 20px;
        }

        .reservation-item {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reservation-info {
            flex: 1;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            background: #4CAF50;
            color: white;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
            margin-right: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .edit-positions-btn {
            background: #ff9800;
        }

        .edit-positions-btn:hover {
            background: #fb8c00;
        }

        .btn-warning {
            background: #ff9800;
        }

        .btn-warning:hover {
            background: #fb8c00;
        }

        .btn-disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-disabled:hover {
            background: #ccc;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* Responsive mobile */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 20px;
            }

            .section {
                padding: 20px;
            }

            .section h2 {
                font-size: 1.4em;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .stat-number {
                font-size: 2.5em;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons .btn {
                width: 100%;
            }

            .reservation-item {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }

            .section h2 {
                font-size: 1.2em;
            }

            .stat-number {
                font-size: 2em;
            }

            .session-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎣 Administration</h1>
            <p>Section Carpe de Soufflenheim - Gestion des week-ends libre</p>
            <a href="index.html" class="back-link">← Retour au site</a>
        </div>

        <div class="content">
            <!-- Statistiques -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Total Réservations</div>
                    <div class="stat-number" id="totalReservations">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Postes Réservés</div>
                    <div class="stat-number" id="totalSpots">0</div>
                    <div style="font-size: 0.9em; margin-top: 5px;">sur 40 possibles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Revenus Attendus</div>
                    <div class="stat-number" id="totalRevenue">0€</div>
                </div>
            </div>

            <!-- Actions rapides -->
            <div class="section">
                <h2>Actions Rapides</h2>
                <div class="action-buttons">
                    <button class="btn edit-positions-btn" onclick="editPositions()">
                        📍 Modifier les positions des postes
                    </button>
                    <button class="btn btn-primary" onclick="exportData()">
                        💾 Exporter les données
                    </button>
                    <button class="btn btn-danger" onclick="resetAll()">
                        🗑️ Réinitialiser tout
                    </button>
                </div>
            </div>

            <!-- Gestion des sessions -->
            <div class="section">
                <h2>Gestion des Sessions</h2>
                <div id="sessionsContainer"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK - Version Compat -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>

    <script>
        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD4cAaaIQ6ghZFtYxV3TqNWS552EtlwoNM",
            authDomain: "section-carpe-soufflenheim.firebaseapp.com",
            projectId: "section-carpe-soufflenheim",
            storageBucket: "section-carpe-soufflenheim.firebasestorage.app",
            messagingSenderId: "546487618596",
            appId: "1:546487618596:web:b64b63fe5bb8adb2a7dcb1"
        };

        // Initialiser Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <script>
        // Protection par mot de passe
        const ADMIN_PASSWORD = "Souffcarpe1664";

        function checkPassword() {
            const password = prompt("🔒 Mot de passe administrateur :");
            if (password !== ADMIN_PASSWORD) {
                alert("❌ Mot de passe incorrect !");
                window.location.href = "index.html";
                return false;
            }
            return true;
        }

        // Vérifier le mot de passe au chargement
        if (!checkPassword()) {
            throw new Error("Accès refusé");
        }

        let sessions = [];

        // Charger les sessions depuis Firebase
        async function loadSessions() {
            const sessionsRef = db.collection('sessions');
            const snapshot = await sessionsRef.get();
            
            if (snapshot.empty) {
                // Initialiser les sessions si elles n'existent pas
                sessions = [
                    { id: 1, date: 'À configurer', reservations: [], closedSpots: [] },
                    { id: 2, date: 'À configurer', reservations: [], closedSpots: [] },
                    { id: 3, date: 'À configurer', reservations: [], closedSpots: [] },
                    { id: 4, date: 'À configurer', reservations: [], closedSpots: [] }
                ];
                
                // Sauvegarder dans Firebase
                for (let session of sessions) {
                    await db.collection('sessions').doc(`session${session.id}`).set(session);
                }
            } else {
                // Charger depuis Firebase
                sessions = [];
                snapshot.forEach((doc) => {
                    sessions.push(doc.data());
                });
                sessions.sort((a, b) => a.id - b.id);
            }
        }

        async function init() {
            await loadSessions();
            displaySessions();
            updateStats();
            setupRealtimeListener();
        }

        // Écouter les changements en temps réel
        function setupRealtimeListener() {
            const sessionsRef = db.collection('sessions');
            
            sessionsRef.onSnapshot((snapshot) => {
                sessions = [];
                snapshot.forEach((doc) => {
                    sessions.push(doc.data());
                });
                sessions.sort((a, b) => a.id - b.id);
                displaySessions();
                updateStats();
            });
        }

        function init() {
            displaySessions();
            updateStats();
        }

        function updateStats() {
            let totalRes = 0;
            let totalSpots = 0;
            
            sessions.forEach(session => {
                totalRes += session.reservations.length;
                totalSpots += session.reservations.length;
            });

            document.getElementById('totalReservations').textContent = totalRes;
            document.getElementById('totalSpots').textContent = totalSpots;
            document.getElementById('totalRevenue').textContent = (totalSpots * 30) + '€';
        }

        function displaySessions() {
            const container = document.getElementById('sessionsContainer');
            container.innerHTML = '';

            sessions.forEach((session, index) => {
                const card = document.createElement('div');
                card.className = 'session-card';
                
                card.innerHTML = `
                    <div class="session-header">
                        <div class="session-title">Session ${session.id}</div>
                        <span class="badge">${session.reservations.length}/10 réservés</span>
                    </div>
                    
                    <div class="form-group">
                        <label>Date du week-end</label>
                        <input type="text" 
                               id="date-${index}" 
                               value="${session.date}" 
                               placeholder="Ex: 15-16 Mars 2025"
                               onchange="updateDate(${index}, this.value)">
                    </div>

                    <div style="margin: 20px 0;">
                        <h3 style="margin-bottom: 10px; color: #1e3c72;">Gestion des postes</h3>
                        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
                            ${Array.from({length: 10}, (_, i) => {
                                const spotNum = i + 1;
                                const isReserved = session.reservations.some(r => r.spot === spotNum);
                                const isClosed = session.closedSpots.includes(spotNum);
                                let status = 'Disponible';
                                let btnClass = 'btn';
                                let btnText = '🔒 Fermer';
                                let action = `toggleSpotStatus(${index}, ${spotNum})`;
                                
                                if (isReserved) {
                                    status = 'Réservé';
                                    btnClass = 'btn btn-disabled';
                                    btnText = '✓ Réservé';
                                    action = '';
                                } else if (isClosed) {
                                    status = 'Fermé';
                                    btnClass = 'btn btn-warning';
                                    btnText = '🔓 Rouvrir';
                                }
                                
                                return `
                                    <div style="text-align: center; padding: 10px; background: ${isClosed ? '#fff3cd' : isReserved ? '#f0f0f0' : '#e8f5e9'}; border-radius: 8px;">
                                        <div style="font-weight: bold; margin-bottom: 5px;">Poste ${spotNum}</div>
                                        <div style="font-size: 0.85em; color: #666; margin-bottom: 8px;">${status}</div>
                                        ${!isReserved ? `<button class="${btnClass}" style="padding: 5px 10px; font-size: 0.85em;" onclick="${action}">${btnText}</button>` : '<div style="height: 32px;"></div>'}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    ${session.reservations.length > 0 ? `
                        <div class="reservations-list">
                            <h3 style="margin-bottom: 15px; color: #1e3c72;">Réservations</h3>
                            ${session.reservations.map((res, resIndex) => `
                                <div class="reservation-item">
                                    <div class="reservation-info">
                                        <strong>Poste ${res.spot}</strong> - ${res.name}<br>
                                        <small>📧 ${res.email} | 📞 ${res.phone}</small>
                                    </div>
                                    <button class="btn btn-danger" onclick="deleteReservation(${index}, ${resIndex})">
                                        🗑️ Supprimer
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<p style="color: #999; margin-top: 15px;">Aucune réservation pour cette session</p>'}
                `;
                
                container.appendChild(card);
            });
        }

        async function updateDate(sessionIndex, newDate) {
            sessions[sessionIndex].date = newDate;
            await db.collection('sessions').doc(`session${sessions[sessionIndex].id}`).update({
                date: newDate
            });
            showAlert('✅ Date mise à jour avec succès !');
        }

        async function toggleSpotStatus(sessionIndex, spotNumber) {
            const session = sessions[sessionIndex];
            const closedIndex = session.closedSpots.indexOf(spotNumber);
            
            if (closedIndex > -1) {
                // Rouvrir le poste
                session.closedSpots.splice(closedIndex, 1);
                showAlert(`✅ Poste ${spotNumber} rouvert !`);
            } else {
                // Fermer le poste
                session.closedSpots.push(spotNumber);
                showAlert(`🔒 Poste ${spotNumber} fermé !`);
            }
            
            await db.collection('sessions').doc(`session${session.id}`).update({
                closedSpots: session.closedSpots
            });
        }

        async function deleteReservation(sessionIndex, resIndex) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette réservation ?')) {
                sessions[sessionIndex].reservations.splice(resIndex, 1);
                await db.collection('sessions').doc(`session${sessions[sessionIndex].id}`).update({
                    reservations: sessions[sessionIndex].reservations
                });
                showAlert('✅ Réservation supprimée avec succès !');
            }
        }

        function editPositions() {
            window.open('index.html?edit=true', '_blank');
        }

        function exportData() {
            const dataStr = JSON.stringify(sessions, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `reservations-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            showAlert('✅ Données exportées avec succès !');
        }

        async function resetAll() {
            if (confirm('⚠️ ATTENTION : Cela supprimera toutes les réservations et réinitialisera les dates.\n\nÊtes-vous absolument sûr ?')) {
                if (confirm('Dernière confirmation : Toutes les données seront perdues !')) {
                    sessions = [
                        { id: 1, date: 'À configurer', reservations: [], closedSpots: [] },
                        { id: 2, date: 'À configurer', reservations: [], closedSpots: [] },
                        { id: 3, date: 'À configurer', reservations: [], closedSpots: [] },
                        { id: 4, date: 'À configurer', reservations: [], closedSpots: [] }
                    ];
                    
                    // Réinitialiser dans Firebase
                    for (let session of sessions) {
                        await db.collection('sessions').doc(`session${session.id}`).set(session);
                    }
                    
                    showAlert('✅ Tout a été réinitialisé !');
                }
            }
        }

        function showAlert(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success';
            alert.textContent = message;
            alert.style.position = 'fixed';
            alert.style.top = '20px';
            alert.style.right = '20px';
            alert.style.zIndex = '10000';
            alert.style.minWidth = '300px';
            document.body.appendChild(alert);
            
            setTimeout(() => {
                alert.style.transition = 'opacity 0.5s';
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 500);
            }, 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
